[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Declared explicitly rather than relying on auto-detection: without this,
# `netlify dev` starts the Astro server but never registers the functions, so
# /api/subscribe silently 404s and the forms look broken locally.
[functions]
  directory = "netlify/functions"

[dev]
  framework = "astro"
  targetPort = 4321
  port = 8888

# A shared system: /s/k7f3q9 serves the viewer, which reads the id off its own
# path and fetches the document from /api/share/:id. A rewrite (200) rather than
# a redirect, so the short link stays in the address bar — it is the thing the
# coach sent, and it is what they will see quoted back at them.
# The target is the ROUTE, not `/studio/watch/index.html`. The file path only
# exists in the production build; under `netlify dev` the page is served by
# Astro and a rewrite to the file 404s, which is a difference between dev and
# production that would only ever be found by a coach.
[[redirects]]
  from = "/s/*"
  to = "/studio/watch/"
  status = 200

# A coach's public profile: /c/andreas_p serves one static page that reads the
# handle off its own path and fetches the row through the PUBLIC RLS policy in
# supabase/012. Same shape as the /s/* rule above, same reason for the 200, and
# the same dev/production difference — the rewrite is applied by `netlify dev`
# on :8888 but not by plain `astro dev` on :4321, which is why
# `handleFromPath` also accepts a `?h=` query.
#
# Only rows whose visibility is 'public' are readable at all, so a handle that
# is private, unclaimed or mistyped all render the same "nothing here". The
# rewrite is not the access control and was never asked to be.
[[redirects]]
  from = "/c/*"
  to = "/c/"
  status = 200

# A published system: /p/k7f3q9 serves one static page that reads the id off its
# own path and fetches the row through `studio_post_by_id` (supabase/024). Same
# shape as the two rules above, same reason for the 200, and the same dev
# difference — `astro dev` on :4321 does not apply it, which is why
# `postIdFromPath` also accepts `?p=`.
#
# Only posts that are public or unlisted exist at all, and a post id is seven
# random Crockford characters, so a mistyped id and a deleted post render the
# same "nothing here". The rewrite is not the access control.
[[redirects]]
  from = "/p/*"
  to = "/p/"
  status = 200

# NO `/o/*` RULE, DELIBERATELY. There used to be one here, a 200-rewrite onto
# /studio/watch/ exactly like the `/s/*` rule above. It is gone because those
# URLs are real pages now: src/pages/o/[slug].astro builds one per official
# system, and each opens the studio ITSELF with the board locked rather than the
# viewer. See the note at the top of that file for both reasons — what a
# stranger should see, and the fact that a blind rewrite left two published
# systems invisible to search behind a single noindex page.
#
# A catch-all rewrite would also have to be removed rather than merely left
# alone: without `force`, Netlify prefers a matching static file, so the two
# real pages would win and every other `/o/…` would silently serve a viewer
# with nothing in it instead of a 404. Two pages exist; everything else there
# should say so.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Astro fingerprints these filenames, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Phase diagrams are content-addressed by slug, not by hash — a month is the
# right trade between freshness and repeat-visit cost.
[[headers]]
  for = "/library/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
