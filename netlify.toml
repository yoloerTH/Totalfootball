[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Declared explicitly rather than relying on auto-detection: without this,
# `netlify dev` starts the Astro server but never registers the functions, so
# /api/subscribe silently 404s and the forms look broken locally.
[functions]
  directory = "netlify/functions"

[dev]
  framework = "astro"
  targetPort = 4321
  port = 8888

# A shared system: /s/k7f3q9 serves the viewer, which reads the id off its own
# path and fetches the document from /api/share/:id. A rewrite (200) rather than
# a redirect, so the short link stays in the address bar — it is the thing the
# coach sent, and it is what they will see quoted back at them.
# The target is the ROUTE, not `/studio/watch/index.html`. The file path only
# exists in the production build; under `netlify dev` the page is served by
# Astro and a rewrite to the file 404s, which is a difference between dev and
# production that would only ever be found by a coach.
[[redirects]]
  from = "/s/*"
  to = "/studio/watch/"
  status = 200

# One of OURS: /o/press-4141 serves the same viewer, which reads the template id
# off its own path and takes the document straight out of the bundle — no
# /api/share, no row, nothing to fetch. See src/studio/share.ts for why an
# official system is addressed by a legible slug rather than published as a
# `/s/` share. Same 200-rewrite reasoning as above, and the same caveat: this
# does not exist under plain `astro dev`, so the viewer also accepts
# `/studio/watch/?t=press-4141`.
[[redirects]]
  from = "/o/*"
  to = "/studio/watch/"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Astro fingerprints these filenames, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Phase diagrams are content-addressed by slug, not by hash — a month is the
# right trade between freshness and repeat-visit cost.
[[headers]]
  for = "/library/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
